<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles/variables.css" />
    <link rel="stylesheet" href="/src/components/Composer.css" />
    <link rel="stylesheet" href="/src/components/PostCard.css" />
    <style>body { margin: 0; padding: 8px; background: var(--bg-dark); color: white; }</style>
    <title>CSS regression check</title>
  </head>
  <body>
    <div class="card-composer">
      <div class="card-textArea-btn">
        <div class="composer-preview">
          <img src="/src/assets/hero.png" alt="Preview grande" />
        </div>
      </div>
    </div>
    <article class="card-post">
      <div class="header"><div class="infoPublish">@autor <button class="report-author-button">🚩</button></div></div>
      <div class="imgPost"><img src="/src/assets/hero.png" alt="Post grande" /></div>
      <div class="post-video-embed"><iframe title="Video" src="about:blank"></iframe></div>
      <a class="post-link-preview" href="#"><span>🔗 example.com</span><span class="post-link-url">https://example.com/link</span></a>
      <div class="options"><button class="btnDestellos">💫 1</button><button class="btnComments">💬 2</button><button class="btnShares">📡 3</button><button class="btnReport">🚩 Reportar</button></div>
    </article>
  </body>
</html>
